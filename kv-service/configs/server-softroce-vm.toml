[api]
listen = "10.31.0.2:55151"
max_connections = 100

[cluster]
node_id = "cs-soft-roce-vm-server"
grpc_advertise = "10.31.0.2:55151"
rdma_advertise = "10.31.0.2:55153"
data_nodes = []

[[cluster.rdma_rails]]
fabric_id = "fabric-a"
listener_endpoint = "10.31.0.2:55153"

[[cluster.rdma_rails]]
fabric_id = "fabric-b"
listener_endpoint = "10.32.0.2:55154"

[storage]
devices = ["/home/railtest/data/rail0", "/home/railtest/data/rail1"]
data_subdir = "contextstore"
striping_threshold = 4194304
striping_chunk_size = 4194304
rdma_stream_chunk_size = 1048576
verify_stripe_checksums = true

[memory_tier]
capacity_mb = 128
slab_size_mb = 4
use_pinned_memory = false

[io_executor]
kind = "tier_a"
thread_pool_size = 8
io_uring_depth = 32

[router]
strategy = "object_hash"

[metadata]
redis_url = "redis://127.0.0.1:6388/"
redis_key_prefix = "contextstore:soft-roce-vm:"
redis_connect_timeout_ms = 1000
redis_command_timeout_ms = 1000

[gc]
enabled = false
interval_seconds = 300
grace_seconds = 600
max_tasks_per_run = 1000
task_lease_seconds = 300

[metrics]
enabled = false
listen = "127.0.0.1:55190"
